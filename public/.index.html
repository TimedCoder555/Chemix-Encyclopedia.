<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />

  <meta
    name="description"
    content="Chemix-Encyclopedia is an interactive chemistry learning web application created by timedcoder."
  />

  <meta name="author" content="timedcoder" />

  <title>Chemix-Encyclopedia</title>

  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #050816, #0f172a);
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
    }

    .loader-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .planet {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(
        45deg,
        #00ffcc,
        #00aaff,
        #7f5cff,
        #00ffcc
      );
      background-size: 400% 400%;
      animation: spin 8s linear infinite,
                 glow 3s ease-in-out infinite alternate,
                 gradientMove 6s ease infinite;
      box-shadow: 0 0 40px #00ffee;
      position: relative;
    }

    .planet::before {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      top: -20px;
      left: -20px;
      animation: orbit 5s linear infinite;
    }

    h1 {
      margin-top: 30px;
      font-size: 35px;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 15px #00ffee;
      animation: pulse 2s infinite;
    }

    p {
      color: #9ca3af;
      margin-top: 10px;
      font-size: 15px;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbit {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes glow {
      from {
        box-shadow: 0 0 20px #00ffee;
      }
      to {
        box-shadow: 0 0 60px #00ffee;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
  </style>
</head>

<body>

  <div class="loader-container">
    <div class="planet"></div>

    <h1>Chemix-Encyclopedia</h1>

    <p>Loading Scientific Experience...</p>
  </div>

  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>

  <div id="root"></div>

</body>
</html>
